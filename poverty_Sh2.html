<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界地圖與詳細資訊模組</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Chart.js 用於繪製下方圖表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入您 CSS 中使用的 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Serif+TC:wght@400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <script>
        // 將您的 CSS 變數綁定到 Tailwind 配置中
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Serif TC', 'serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['DM Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            light: 'var(--olive-light)',
                            DEFAULT: 'var(--olive)',
                            dark: 'var(--olive-dark)'
                        },
                        cream: 'var(--cream)',
                        charcoal: 'var(--charcoal)',
                        customGray: 'var(--gray)',
                        customBorder: 'var(--border)',
                        customWhite: 'var(--white)'
                    }
                }
            }
        }
    </script>
    <style>
        
        /*全站色彩與字體*/
        :root {
            --olive:      #6b6b2a;
            --olive-dark: #4a4a1a;
            --olive-light:#a0a060;
            --cream:      #f5f3ee;
            --charcoal:   #1c1c1c;
            --gray:       #888;
            --border:     #d4d0c4;
            --white:      #ffffff;
            --nav-h:      68px;
        }

        /* 全域重置與基底 */
        body {
            font-family: 'Noto Serif TC', serif;
            background: var(--cream);
            color: var(--charcoal);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        /* 簡單的過渡動畫 */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 設定五大洲專屬的脈衝動畫 (Pulse)
        透過自訂 CSS，讓發光圈圈的顏色與原點一致
        */
        /* 1. 亞洲：紅色 (Red) */
        .pulse-asia {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); /* Tailwind red-500 */
            animation: pulseAsia 2s infinite;
        }
        @keyframes pulseAsia {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* 2. 歐洲：藍色 (Blue) */
        .pulse-europe {
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); /* Tailwind blue-500 */
            animation: pulseEurope 2s infinite;
        }
        @keyframes pulseEurope {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* 3. 非洲：黃色 (Yellow) */
        .pulse-africa {
            box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); /* Tailwind yellow-500 */
            animation: pulseAfrica 2s infinite;
        }
        @keyframes pulseAfrica {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(234, 179, 8, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }

        /* 4. 美洲：綠色 (Green) - 這裡我們將南美洲與北美洲統稱美洲作為示範 */
        .pulse-americas {
            box-shadow: 0 0 0 0 rgba(4, 126, 49, 0.7); /* Tailwind green-500 */
            animation: pulseAmericas 2s infinite;
        }
        @keyframes pulseAmericas {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(4, 126, 49, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(4, 126, 49, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(4, 126, 49, 0); }
        }

        /* 5. 大洋洲：紫色 (Purple) */
        .pulse-oceania {
            box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); /* Tailwind purple-500 */
            animation: pulseOceania 2s infinite;
        }
        @keyframes pulseOceania {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(168, 85, 247, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }
    </style>
</head>

                    </div>
                </div>
                <p id="detail-subtitle" class="text-xl text-gray-800 font-medium leading-relaxed max-w-4xl opacity-90">
                    【國家簡介副標題預留位】
                </p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-[60%_35%] gap-12 mb-12">
                <!-- 左側：動態文字區 -->
                <div>
                    <h3 id="detail-desc-title" class="text-2xl font-serif font-bold text-charcoal mb-4">【現況描述標題】</h3>
                    <div id="detail-desc-content" class="space-y-4 text-gray-800 text-lg leading-relaxed">
                        <!-- JS 將會在這裡插入 <p> 段落 -->
                    </div>
                </div>

                <!-- 右側：資料表格區 (左側英文固定，右側數據動態更新) -->
                <div class="bg-cream p-6 border border-customBorder">
                    <h4 class="text-lg font-serif font-bold text-charcoal mb-6">宏觀經濟與主權數據</h4>
                    <table class="w-full text-sm text-left">
                        <tbody>
                            <tr class="border-b border-customBorder">
                                <td class="py-3 px-2 text-gray-600 w-1/2">政府體制</td>
                                <td id="table-gov" class="py-3 px-2 font-semibold text-charcoal"></td>
                            </tr>
                            <tr class="bg-customWhite border-b border-customBorder">
                                <td class="py-3 px-2 text-gray-600">首都</td>
                                <td id="table-capital" class="py-3 px-2 font-semibold text-charcoal"></td>
                            </tr>
                            <tr class="border-b border-customBorder">
                                <td class="py-3 px-2 text-gray-600 align-top">主權信用評級</td>
                                <td id="table-ratings" class="py-3 px-2 font-semibold text-charcoal leading-relaxed"></td>
                            </tr>
                            <tr class="bg-customWhite border-b border-customBorder">
                                <td class="py-3 px-2 text-gray-600">總人口</td>
                                <td id="table-pop" class="py-3 px-2 font-semibold text-charcoal"></td>
                            </tr>
                            <tr class="border-b border-customBorder">
                                <td class="py-3 px-2 text-gray-600">年齡中位數</td>
                                <td id="table-age" class="py-3 px-2 font-semibold text-charcoal"></td>
                            </tr>
                            <tr class="bg-customWhite border-b border-customBorder">
                                <td class="py-3 px-2 text-gray-600">成人平均每人所得(購買力平價PPP)</td>
                                <td id="table-income" class="py-3 px-2 font-semibold text-charcoal"></td>
                            </tr>
                            <tr>
                                <td class="py-3 px-2 text-gray-600">國內生產總值(2023)</td>
                                <td id="table-gdp" class="py-3 px-2 font-semibold text-charcoal"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ================= 新增區塊：如果沒有資料就隱藏 ================= -->

            <!-- 區段 A：左右雙圖表 (GDP Overview) -->
            <div id="section-overview-charts" class="hidden border-t border-customBorder pt-10 mb-12">
                <h3 id="detail-chart-maintitle" class="text-3xl font-serif font-bold text-charcoal mb-8">【國家】GDP與經濟概況</h3>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <div id="wrapper-chart-left" class="hidden">
                        <h4 id="chart-left-title" class="text-lg font-bold text-charcoal"></h4>
                        <p id="chart-left-subtitle" class="text-sm text-customGray mb-4"></p>
                        <div id="chart-left-html" class="w-full aspect-[4/3] relative"></div>
                        <p id="chart-left-source" class="text-xs text-customGray opacity-70 mt-2"></p>
                    </div>
                    <div id="wrapper-chart-right" class="hidden">
                        <h4 id="chart-right-title" class="text-lg font-bold text-charcoal"></h4>
                        <p id="chart-right-subtitle" class="text-sm text-customGray mb-4"></p>
                        <div id="chart-right-html" class="w-full aspect-[4/3] relative"></div>
                        <p id="chart-right-source" class="text-xs text-customGray opacity-70 mt-2"></p>
                    </div>
                </div>
            </div>

            <!-- 區段 B：Banking & Finance (左表格 + 右圖表) -->
            <div id="section-banking" class="hidden border-t border-customBorder pt-10 mb-12">
                <h3 class="text-3xl font-serif font-bold text-charcoal mb-8">銀行與金融</h3>
                <div class="grid grid-cols-1 lg:grid-cols-[40%_55%] gap-12">
                    
                    <!-- 左側：貿易表格 -->
                    <div id="wrapper-trade-invest" class="hidden bg-customWhite p-6 border border-customBorder self-start">
                        <h4 class="text-xl font-serif font-bold text-charcoal mb-6">貿易與投資</h4>
                        <table class="w-full text-sm text-left">
                            <tbody id="trade-invest-tbody">
                                <!-- JS 動態生成列 -->
                            </tbody>
                        </table>
                        <p id="trade-source" class="text-xs text-customGray opacity-70 mt-4"></p>
                    </div>

                    <!-- 右側：FDI 圖表 -->
                    <div id="wrapper-fdi-chart" class="hidden">
                        <h4 id="fdi-chart-title" class="text-lg font-bold text-charcoal"></h4>
                        <p id="fdi-chart-subtitle" class="text-sm text-customGray mb-4"></p>
                        <div id="fdi-chart-html" class="w-full relative"></div>
                        <p id="fdi-chart-source" class="text-xs text-customGray opacity-70 mt-2"></p>
                    </div>
                </div>
            </div>

            <!-- 區段 C：三個表格 (上方深色大表 + 下方左右兩個淺色表) -->
            <div id="section-tables" class="hidden pt-2 mb-12">
                
                <!-- 上方：Leading Companies (深色滿版表格) -->
                <div id="wrapper-leading-companies" class="hidden text-white p-8 mb-8" style="background:var(--charcoal);">
                    <h3 id="leading-companies-title" class="text-2xl font-serif font-bold text-white mb-6">【國家】 主要企業</h3>
                    <table class="w-full text-sm text-left">
                        <tbody id="leading-companies-tbody" class="divide-y divide-gray-600">
                            <!-- JS 動態生成列 -->
                        </tbody>
                    </table>
                </div>

                <!-- 下方：Major Trade Partners (左右並排) -->
                <div id="wrapper-trade-partners" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Import 表格 -->
                    <div class="bg-customWhite p-8 border border-customBorder">
                        <h4 class="text-xl font-serif font-bold text-charcoal text-center mb-6">主要貿易夥伴 — 進口</h4>
                        <table class="w-full text-sm text-left">
                            <tbody id="partners-import-tbody">
                                <!-- JS 動態生成列 -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Export 表格 -->
                    <div class="bg-customWhite p-8 border border-customBorder">
                        <h4 class="text-xl font-serif font-bold text-charcoal text-center mb-6">主要貿易夥伴 — 出口</h4>
                        <table class="w-full text-sm text-left">
                            <tbody id="partners-export-tbody">
                                <!-- JS 動態生成列 -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <p id="partners-source" class="text-xs text-customGray opacity-70 mt-4"></p>
            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- JS 資料庫與互動腳本 -->
    <!-- ========================================== -->
    
    <!-- ------------------------------------------------------>
    <!--1. 建立「國家資料庫」-->
    <!-- ------------------------------------------------------>
    <script src="country_data.js"></script>
        
    <!-- ------------------------------------------------------>
    <!--2. 視圖切換與資料綁定邏輯-->
    <!-------------------------------------------------------->
    <script>
        const tooltip = document.getElementById('map-tooltip');

        function showMapTooltip(event, title, desc, countryKey) {
            document.getElementById('tooltip-title').innerText = title;
            document.getElementById('tooltip-desc').innerText = desc;

            const rankingBadge = document.getElementById('tooltip-ranking-badge');
            
            if (countryKey && typeof countryDatabase !== 'undefined' && countryDatabase[countryKey] && countryDatabase[countryKey].ranking) {
                document.getElementById('tooltip-ranking').innerText = `全球最貧窮排名：第 ${countryDatabase[countryKey].ranking} 名`;
                rankingBadge.classList.remove('hidden');
                rankingBadge.classList.add('inline-flex');
            } else {
                rankingBadge.classList.add('hidden');
                rankingBadge.classList.remove('inline-flex');
            }

            tooltip.classList.remove('hidden');
            moveMapTooltip(event);
        }

        function moveMapTooltip(event) {
            tooltip.style.left = event.clientX + 'px';
            tooltip.style.top = (event.clientY - 15) + 'px'; 
        }

        function hideMapTooltip() {
            tooltip.classList.add('hidden');
        }

        function showMapDetails(countryKey) {
            hideMapTooltip();
            const data = countryDatabase[countryKey];
            
            if(!data) return;

            // 1. 填入基礎資料
            document.getElementById('detail-title').innerText = data.title;
            document.getElementById('detail-subtitle').innerText = data.subtitle;
            document.getElementById('detail-desc-title').innerText = data.descTitle;
            
            // 動態判斷並載入國旗圖片
            const flagImg = document.getElementById('detail-flag');
            if (data.flagUrl) {
                flagImg.src = data.flagUrl;
                flagImg.classList.remove('hidden');
            } else {
                flagImg.classList.add('hidden');
            }
            
            const rankingBadgeDetail = document.getElementById('detail-ranking-badge');
            if (data.ranking) {
                document.getElementById('detail-ranking').innerText = `全球最貧窮排名(2025)：第 ${data.ranking} 名`;
                rankingBadgeDetail.classList.remove('hidden');
            } else {
                rankingBadgeDetail.classList.add('hidden');
            }

            const contentDiv = document.getElementById('detail-desc-content');
            contentDiv.innerHTML = ''; 
            data.descParagraphs.forEach(para => {
                const p = document.createElement('p'); p.innerText = para; contentDiv.appendChild(p);
            });

            document.getElementById('table-gov').innerText = data.table.gov;
            document.getElementById('table-capital').innerText = data.table.capital;
            document.getElementById('table-ratings').innerHTML = data.table.ratings;
            document.getElementById('table-pop').innerText = data.table.pop;
            document.getElementById('table-age').innerText = data.table.age;
            document.getElementById('table-income').innerText = data.table.income;
            document.getElementById('table-gdp').innerText = data.table.gdp;

            // ============================================
            // 以下為「動態顯示/隱藏」模組的邏輯
            // ============================================

            // A. 雙圖表 (GDP Overview)
            const sectionOverview = document.getElementById('section-overview-charts');
            const wrapLeft = document.getElementById('wrapper-chart-left');
            const wrapRight = document.getElementById('wrapper-chart-right');
            
            if (data.charts) {
                sectionOverview.classList.remove('hidden');
                document.getElementById('detail-chart-maintitle').innerText = `${countryKey} GDP與經濟概況`;
                
                if (data.charts.left) {
                    wrapLeft.classList.remove('hidden');
                    document.getElementById('chart-left-html').innerHTML = data.charts.left.html;
                } else { wrapLeft.classList.add('hidden'); }

                if (data.charts.right) {
                    wrapRight.classList.remove('hidden');
                    document.getElementById('chart-right-html').innerHTML = data.charts.right.html;
                } else { wrapRight.classList.add('hidden'); }
            } else {
                sectionOverview.classList.add('hidden'); // 沒有資料就完全隱藏
            }

            // B. Banking & Finance
            const sectionBanking = document.getElementById('section-banking');
            const wrapTradeInvest = document.getElementById('wrapper-trade-invest');
            const wrapFdi = document.getElementById('wrapper-fdi-chart');

            if (data.tradeAndInvestment || data.fdiChart) {
                sectionBanking.classList.remove('hidden');
                
                if (data.tradeAndInvestment) {
                    wrapTradeInvest.classList.remove('hidden');
                    const tb = document.getElementById('trade-invest-tbody');
                    tb.innerHTML = `
                        <tr class="border-b border-customBorder"><td class="py-3 text-customGray w-2/5">總出口額</td><td class="py-3 font-semibold text-charcoal">${data.tradeAndInvestment.exports}</td></tr>
                        <tr class="bg-customWhite border-b border-customBorder"><td class="py-3 text-customGray align-top">主要出口項目</td><td class="py-3 font-semibold text-charcoal leading-relaxed">${data.tradeAndInvestment.leadingExports}</td></tr>
                        <tr class="border-b border-customBorder"><td class="py-3 text-customGray">總進口額</td><td class="py-3 font-semibold text-charcoal">${data.tradeAndInvestment.imports}</td></tr>
                        <tr class="bg-customWhite"><td class="py-3 text-customGray align-top">主要進口項目</td><td class="py-3 font-semibold text-charcoal leading-relaxed">${data.tradeAndInvestment.leadingImports}</td></tr>
                    `;
                } else { wrapTradeInvest.classList.add('hidden'); }

                if (data.fdiChart) {
                    wrapFdi.classList.remove('hidden');
                    document.getElementById('fdi-chart-html').innerHTML = data.fdiChart.html;
                } else { wrapFdi.classList.add('hidden'); }
            } else {
                sectionBanking.classList.add('hidden');
            }

            // C. 底部三大表格
            const sectionTables = document.getElementById('section-tables');
            const wrapLeading = document.getElementById('wrapper-leading-companies');
            const wrapPartners = document.getElementById('wrapper-trade-partners');

            if (data.leadingCompanies || data.tradePartners) {
                sectionTables.classList.remove('hidden');
                
                // 深色大表
                if (data.leadingCompanies && data.leadingCompanies.length > 0) {
                    wrapLeading.classList.remove('hidden');
                    document.getElementById('leading-companies-title').innerText = `${countryKey} 主要企業`;
                    const tbLeading = document.getElementById('leading-companies-tbody');
                    tbLeading.innerHTML = '';
                    data.leadingCompanies.forEach(comp => {
                        tbLeading.innerHTML += `<tr><td class="py-4 font-semibold">${comp.name}</td><td class="py-4 text-right font-bold text-gray-300">${comp.sector}</td></tr>`;
                    });
                } else { wrapLeading.classList.add('hidden'); }

                // 左右進出口表格
                if (data.tradePartners) {
                    wrapPartners.classList.remove('hidden');
                    document.getElementById('partners-source').innerText = data.tradePartners.source || '';
                    
                    const tbImp = document.getElementById('partners-import-tbody');
                    tbImp.innerHTML = '';
                    data.tradePartners.import.forEach((p, index) => {
                        const bg = index % 2 !== 0 ? 'bg-gray-50' : '';
                        tbImp.innerHTML += `<tr class="border-b border-gray-100 ${bg}"><td class="py-3 px-2 text-customGray">${p.country}</td><td class="py-3 px-2 text-right font-bold text-charcoal">${p.percent}</td></tr>`;
                    });

                    const tbExp = document.getElementById('partners-export-tbody');
                    tbExp.innerHTML = '';
                    data.tradePartners.export.forEach((p, index) => {
                        const bg = index % 2 !== 0 ? 'bg-gray-50' : '';
                        tbExp.innerHTML += `<tr class="border-b border-gray-100 ${bg}"><td class="py-3 px-2 text-customGray">${p.country}</td><td class="py-3 px-2 text-right font-bold text-charcoal">${p.percent}</td></tr>`;
                    });
                } else {
                    wrapPartners.classList.add('hidden');
                    document.getElementById('partners-source').innerText = '';
                }
            } else {
                sectionTables.classList.add('hidden');
            }

            // 切換視圖
            document.getElementById('map-main-view').classList.add('hidden');
            document.getElementById('map-main-view').classList.remove('block');
            document.getElementById('map-detail-view').classList.remove('hidden');
            document.getElementById('map-detail-view').classList.add('block');
            // 視窗捲動到詳細資訊的頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideMapDetails() {
            document.getElementById('map-detail-view').classList.add('hidden');
            document.getElementById('map-detail-view').classList.remove('block');
            
            document.getElementById('map-main-view').classList.remove('hidden');
            document.getElementById('map-main-view').classList.add('block');
        }
    </script>
</body>
</html>
