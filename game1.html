<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>消費挑戰賽</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Serif+TC:wght@300;400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">


<!-- //css -->
    <style>
        :root {
            --olive:       #6b6b2a;
            --olive-dark:  #4a4a1a;
            --olive-light: #a0a060;
            --cream:       #f5f3ee;
            --charcoal:    #1c1c1c;
            --gray:        #888;
            --border:      #d4d0c4;
            --white:       #ffffff;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Serif TC', serif;
            background: var(--cream);
            color: var(--charcoal);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #balance-container {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--olive);
            color: var(--white);
            padding: 12px 24px;
            font-family: 'DM Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            border-radius: 50px;
            z-index: 100;
        }

        .game-container {
            background: #3d3b2a;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 40px;
            width: 90%;
            max-width: 520px;
            text-align: center;
        }

        #question-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 28px;
            line-height: 1.4;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.88rem;
            letter-spacing: 0.04em;
            text-align: left;
        }

        button:hover {
            background: var(--olive);
            border-color: var(--olive);
            color: var(--white);
        }

        .hidden { display: none; }
    </style>

<!-- //html -->

    
</head>
<body>

    <div id="balance-container">
        今日餘額：$<span id="balance">0</span>
    </div>

    <div class="game-container">
        <div id="quiz-card">
            <h2 id="question-text">載入中...</h2>
            <div id="options-container">
                </div>
        </div>

        <div class="history-container">
            <h3>消費足跡</h3>
            <ul id="history-list">
                <!-- 透過 JS 動態新增紀錄 -->
                <li class="history-item" style="color: #999; text-align: center; border: none; margin-top: 20px;">尚未開始旅行...</li>
            </ul>
        </div>
        
        <div id="result-card" class="hidden">
            <h2>今日結算</h2>
            <p id="final-status"></p>
            <button onclick="location.reload()">再玩一次</button>
        </div>
    </div>


    <!-- //js -->
    <script>

//https://data.worldbank.org/indicator/NE.CON.PRVT.PC.KD

// 定義資料表：第一層是洲，第二層是該洲的國家跟那洲的消費水準
// 以2015為基準年 以數據庫有的最近年 美金匯率以32.0計算 excel表
const geoData = {
    "亞洲": [
        { name: "Bangladesh 預算:NT$116", budget: 116 },
        { name: "China 預算:NT$470", budget: 470 },
        { name: "India 預算:NT$125", budget: 125 },
        { name: "Japan 預算:NT$1713", budget: 1713 },
        { name: "Saudi Arabia 預算:NT$1040", budget: 1040 },
        { name: "Taiwan 預算:NT$2660", budget: 2660 },
        { name: "Yemen, Rep. 預算:NT$109", budget: 109 }
    ],
    "歐洲": [
        { name: "Germany 預算:NT$1977", budget: 1977 },
        { name: "United Kingdom 預算:NT$2566", budget: 2566 },
        { name: "Greece 預算:NT$1272", budget: 1272 },
        { name: "Norway 預算:NT$2937", budget: 2937 },
        { name: "Ukraine 預算:NT$182", budget: 182 },
    ],
    "美洲": [
        { name: "Bolivia 預算:NT$192", budget: 192 },
        { name: "Brazil 預算:NT$545", budget: 545 },
        { name: "Haiti 預算:NT$111", budget: 111 },
        { name: "Mexico 預算:NT$655", budget: 655 },
        { name: "United States 預算:NT$3854", budget: 3854 }
    ],
    "大洋洲": [
        { name: "Australia 預算:NT$2961", budget: 2961 },
        { name: "New Zealand 預算:NT$2294", budget: 2294 },
        { name: "Solomon Islands 預算:NT$127", budget: 127 }
    ],
    "非洲": [
        { name: "Burundi 預算:NT$17", budget: 17 },
        { name: "Central African Republic 預算:NT$40", budget: 40 },
        { name: "Congo, Dem. Rep. 預算:NT$27", budget: 27 },
        { name: "Madagascar 預算:NT$29", budget: 29 },
        { name: "Mozambique 預算:NT$39", budget: 39 },
        { name: "Somalia, Fed. Rep. 預算:NT$55", budget: 55 }
    ]
};

// 消費題目清單
const expenseQuestions = [
    { q: "早安，早餐吃什麼？",
         opts: [
            { t: "奢華全套早午餐 花費:NT$650", c: 650 }, 
            { t: "連鎖咖啡廳早餐 花費:NT$220", c: 220 },
            { t: "美而美早餐店 花費:NT$70", c: 70 },
            { t: "超商肉鬆飯糰 花費:NT$25", c:25},
            { t: "茶葉蛋 花費:NT$10", c:10},
            { t: "過期吐司 花費:NT$5", c:5},
            { t: "不吃 花費:NT$0", c:0}
        ] 
    },
    { q: "去上班，交通方式?", 
        opts: [
            { t: "Uber 花費:NT$300", c: 300 },
            { t: "捷運 花費:NT$40", c: 40 },
            { t: "公車 花費:NT$25", c:25},
            { t: "走路 花費:NT$0", c:0}
        ] 
    },
    { q: "中午了，午餐吃什麼？", 
        opts: [
            { t: "米其林名店 花費:NT$1200", c: 1200 },
            { t: "主題餐廳 花費:NT$800", c: 800 },
            { t: "美食街 花費:NT$280", c:280 },
            { t: "雞腿便當 花費:NT$90", c:90 },
            { t: "滷肉飯 花費:NT$50", c:50},
            { t: "白米飯 花費:NT$10", c:10},
            { t: "不吃 花費:NT$0", c:0}
        ] 
    },
    { q: "下午茶時間到", 
        opts: [
            { t: "精緻千層蛋糕配咖啡 花費:NT$450", c: 450 }, 
            { t: "手搖飲 花費:NT$65", c: 65 },
            { t: "小零食 花費:NT$10", c:10},
            { t: "不吃 花費:NT$0", c:0}
        ] 
    },
    { q: "下班逛街，買衣服嗎？", 
        opts: [
            { t: "買 花費:NT$1000", c: 1000 }, 
            { t: "不買 花費:NT$0", c: 0 }
        ] 
    },
    { q: "不小心感冒了，看醫生嗎", 
        opts: [
            { t: "看 花費:NT$200", c: 200 }, 
            { t: "不看 花費:NT$0", c: 0 }
        ] 
    },
    { q: "晚餐吃什麼？", 
        opts: [
            { t: "吃到飽餐廳 花費:NT$1500", c: 1500 },
            { t: "居酒屋 花費:NT$800", c: 800 },
            { t: "小火鍋 花費:NT$500", c:500},
            { t: "拉麵 花費:NT$300", c:300 },
            { t: "便當 花費:NT$90", c:90 },
            { t: "i珍食 花費:NT$50", c:50},
            { t: "不吃 花費:NT$0", c:0}
        ] 
    },
    { q: "有一場想看的電影，看不看?", 
        opts: [
            { t: "看 花費:NT$200", c: 200 },
            { t: "不看 花費:NT$0", c: 0 }
        ] 
    },
    { q: "怎麼回家?", 
        opts: [
            { t: "Uber 花費:NT$100", c: 100 },
            { t: "公車 花費:NT$20", c:20},
            { t: "走路 花費:NT$0", c:0}
        ] 
    },    
    { q: "住哪(租屋處)？", 
        opts: [
            { t: "豪華大別墅 花費:NT$4000", c: 4000 },
            { t: "普通公寓 花費:NT$900", c: 900 },
            { t: "合租套房 花費:NT$500", c: 500 },
            { t: "破舊雅房 花費:NT$300", c: 300 },
            { t: "睡路邊 花費:NT$0", c:0 }
        ] 
    }
];



// 邏輯
let balance = 0;
let currentStep = 0; // 控制目前在哪一關
let selectedContinent = "";

const questionText = document.getElementById('question-text');
const optionsBox = document.getElementById('options-container');
const balanceDisplay = document.getElementById('balance');
const historyList = document.getElementById('history-list');

function startLevel() {
    optionsBox.innerHTML = ''; // 清空舊按鈕

    // --- 第一關：選五大洲 ---
    if (currentStep === 0) {
        questionText.innerText = "請選擇你出生的洲：";
        // 直接從 geoData 抓出所有的「鍵 (Key)」：亞洲, 歐洲...
        Object.keys(geoData).forEach(continent => {
            makeButton(continent, () => {
                selectedContinent = continent; // 儲存選擇
                addHistoryRecord(`出生於：${continent}`);
                currentStep = 1;
                startLevel();
            });
        });
    } 
    // --- 第二關：根據剛才選的洲，顯示對應國家 ---
    else if (currentStep === 1) {
        questionText.innerText = `在 ${selectedContinent}，你出生的國家？`;
        // 這裡完全不用 if，直接用選好的 continent 去抓 array
        geoData[selectedContinent].forEach(country => {
            makeButton(country.name, () => {
                balance = country.budget; // 設定初始金額
                
                historyList.innerHTML = ''; 
                addHistoryRecord(`出生國家：${country.name}`);
                addHistoryRecord(`當地消費預算：$${country.budget}`);

                updateUI();
                currentStep = 2; // 進入消費題目
                startLevel();
            });
        });
    }
    // --- 第三關以後：消費題目 ---
    else {
        const quizIdx = currentStep - 2;
        if (quizIdx < expenseQuestions.length) {
            const currentQ = expenseQuestions[quizIdx];
            questionText.innerText = currentQ.q;

            const minCostInQuiz = Math.min(...currentQ.opts.map(o => o.c));

            currentQ.opts.forEach(opt => {
                const btn=makeButton(opt.t, () => {
                    balance -= opt.c;

                    addHistoryRecord(`消費：${opt.t} (-$${opt.c})`);

                    updateUI();
                    currentStep++;
                    startLevel();
                });

                if (balance < opt.c) {
                    btn.disabled = true;
                    btn.style.opacity = "0.5"; // 讓按鈕變淡暗示不能選
                    btn.style.cursor = "not-allowed";
                }
            });
        } else {
            finishGame();
        }
    }
}

function makeButton(text, clickEvent) {
    const btn = document.createElement('button');
    btn.innerText = text;
    btn.onclick = clickEvent;
    optionsBox.appendChild(btn);
    return btn;
}

// 選擇紀錄
function addHistoryRecord(text) {
    const li = document.createElement('li');
    li.className = 'history-item';
    li.innerText = text;
    historyList.appendChild(li);
            
    // 讓滾輪自動滾到最下面，方便看最新紀錄
    historyList.scrollTop = historyList.scrollHeight;
    }

function updateUI() {
    balanceDisplay.innerText = balance.toLocaleString();
}

function finishGame() {
    questionText.innerText = "測驗結束！";
    optionsBox.innerHTML = `<h3>你的今日餘額為：${balance}</h3><button onclick="location.reload()">重新玩</button>`;
}

// 啟動遊戲
startLevel(); 
    </script>
</body>
</html>
