            align-items: stretch;

            background: #3d3b2a;

            padding: 0;
            margin: 0;

            flex: 1;

            color: var(--charcoal);
            text-align: left;
            line-height: 1.4;

  <script>
    function setLang(l){localStorage.setItem('siteLang',l);applyLang(l)}
    function applyLang(l){
      document.querySelectorAll('[data-zh][data-en]').forEach(function(e){e.textContent=l==='zh'?e.dataset.zh:e.dataset.en});
      document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.textContent.trim()===(l==='zh'?'中':'EN'))});
      if(l==='en'){document.body.classList.add('en-mode')}else{document.body.classList.remove('en-mode')}

      // 更新動態設定的國家看板
      const countryDisp = document.getElementById('current-country');
      if(countryDisp && countryDisp.getAttribute('data-zh')){
        countryDisp.innerText = l === 'zh' ? countryDisp.getAttribute('data-zh') : countryDisp.getAttribute('data-en');
        }

      // 如果遊戲已經載入（函式存在），切換語言時就立即重新渲染當前關卡
      if (typeof startLevel === 'function') {
        startLevel();
        }
    }

    // 初始化語言環境
    document.addEventListener("DOMContentLoaded", function() {
        applyLang(localStorage.getItem('siteLang')||'zh');
    });

    </script>

                "Bolivia": "玻利維亞", "Brazil": "巴西", "Haiti": "海地", "Mexico": "墨西哥", "United States": "美國",
                "Australia": "澳洲", "New Zealand": "紐西蘭", "Solomon Islands": "索羅門群島",
                "Burundi": "蒲隆地", "Central African Republic": "中非共和國", "Congo, Dem. Rep.": "剛果民主共和國", "Madagascar": "馬達加斯加", "Mozambique": "莫三比克", "Somalia, Fed. Rep.": "索馬利亞"
            };

            const budgetEN = { "預算": "Budget" };

            var buttonText = country.name;
            if (en) {
                buttonText = country.name.replace("預算", budgetEN["預算"]);
            } else {
                // 找出資料中的英文國名，並塞入中文翻譯（例如 "China 預算:NT$470" 變成 "China (中國) 預算:NT$470"）
                for (let engName in countryZH) {
                    if (country.name.startsWith(engName)) {
                        buttonText = country.name.replace(engName, `${engName} (${countryZH[engName]})`);
                        break;
                    }
                }
            }

            makeButton(buttonText, () => {
                balance = country.budget;

                // 為了讓看板國家名稱能即時切換語言，給它設定 data 屬性
                var zhName = country.name;
                for (let engName in countryZH) {
                    if (country.name.startsWith(engName)) {
                        zhName = country.name.replace(engName, `${engName} (${countryZH[engName]})`);
                        break;
                    }
                }
                var enName = country.name.replace("預算", budgetEN["預算"]);
                countryDisplay.setAttribute('data-zh', zhName);
                countryDisplay.setAttribute('data-en', enName);
                countryDisplay.innerText = en ? enName : zhName;

                historyList.innerHTML = '';
                addHistoryRecord({ zh: `出生國家：${zhName}`, en: `Country: ${enName}` }); 
                addHistoryRecord({ zh: `當地消費預算：$${country.budget}`, en: `Daily budget: $${country.budget}` });

                updateUI();
                currentStep = 2;
                startLevel();
            });
        });
    }
    // --- 第三關以後：消費題目 ---
    else {
        const quizIdx = currentStep - 2;
        if (quizIdx < expenseQuestions.length) {
            const currentQ = expenseQuestions[quizIdx];
            questionText.innerText = en ? currentQ.qe : currentQ.q;

            currentQ.opts.forEach(opt => {
                var label = en ? opt.te : opt.t;
                const btn=makeButton(label, () => {
                    balance -= opt.c;

                    addHistoryRecord({ zh: `消費：${opt.t}`, en: `Spent: ${opt.te}` });        
                    updateUI();
                    currentStep++;
                    startLevel();
                });

                if (balance < opt.c) {
                    btn.disabled = true;
                    btn.style.opacity = "0.5";
                    btn.style.cursor = "not-allowed";
                }
            });
        } else {
            finishGame();
        }
    }
}

function makeButton(text, clickEvent) {
    const btn = document.createElement('button');
    btn.innerText = text;
    btn.onclick = clickEvent;
    optionsBox.appendChild(btn);
    return btn;
}

// 選擇紀錄
function addHistoryRecord(langObj) {
    const li = document.createElement('li');
    li.className = 'history-item';

    // 建立雙語結構
    li.innerHTML = `<span class="lang-zh">${langObj.zh}</span><span class="lang-en">${langObj.en}</span>`;

    historyList.appendChild(li);
            
    // 讓滾輪自動滾到最下面，方便看最新紀錄
    historyList.scrollTop = historyList.scrollHeight;
    }

function updateUI() {
    balanceDisplay.innerText = balance.toLocaleString();
}

function finishGame() {
    var en = isEn();
    questionText.innerText = en ? "Game Over!" : "遊戲結束！";
    optionsBox.innerHTML = en
        ? `<h3 style="color:#f5f3ee; margin-bottom: 15px;">Your remaining balance: $${balance.toLocaleString()}</h3><button onclick="location.reload()">Play Again</button>`
        : `<h3 style="color:#f5f3ee; margin-bottom: 15px;">你的今日餘額為：$${balance.toLocaleString()}</h3><button onclick="location.reload()">重新玩</button>`;
}

// 啟動遊戲
startLevel(); 
    </script>
</body>
</html>
