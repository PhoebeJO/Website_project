  <script>
    function setLang(l){

      // Sync with this page's own switchLanguage if available

    }
    function applyLang(l){
      document.querySelectorAll('[data-zh][data-en]').forEach(function(e){e.textContent=l==='zh'?e.dataset.zh:e.dataset.en});
      document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.textContent.trim()===(l==='zh'?'中':'EN'))});
    }
    // Will be called again after switchLanguage is defined
    applyLang(localStorage.getItem('siteLang')||'zh');
  </script>

                <span class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-blue-400"></div> <span class="lang-str" data-zh="歐洲" data-en="Europe">歐洲</span></span>
                <span class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-yellow-400"></div> <span class="lang-str" data-zh="非洲" data-en="Africa">非洲</span></span>
                <span class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-green-700"></div> <span class="lang-str" data-zh="美洲" data-en="Americas">美洲</span></span>
                <span class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-purple-700"></div> <span class="lang-str" data-zh="大洋洲" data-en="Oceania">大洋洲</span></span>

        <!-- 跟隨滑鼠的提示框 -->
        <div id="map-tooltip" class="fixed hidden z-50 bg-white px-4 py-3 shadow-xl border-2 border-brand pointer-events-none transform -translate-x-1/2 -translate-y-[120%]">
            <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-white border-b-2 border-r-2 border-brand rotate-45"></div>
            <p id="tooltip-title" class="font-bold text-brand-dark text-lg"></p>
            <div id="tooltip-ranking-badge" class="hidden mt-1 mb-1 bg-red-50 text-red-700 px-2 py-1 rounded text-xs font-bold border border-red-200 items-center gap-1">
                <i class="fa-solid fa-ranking-star"></i> <span id="tooltip-ranking"></span>

        <!-- ========================================== -->
        <!-- 視圖 2：點進去後的詳細資訊【模板區塊】 -->
        <!-- ========================================== -->
        <div id="map-detail-view" class="hidden fade-in pt-4 mt-12 md:mt-0">
            
            <button onclick="hideMapDetails()" class="mb-8 px-5 py-2.5 bg-cream text-charcoal border border-customBorder hover:bg-brand hover:text-customWhite transition flex items-center gap-2 font-bold">

            <div class="mb-8">

                    <h2 id="detail-title" class="text-4xl font-serif font-bold text-charcoal"></h2>
                    <div id="detail-ranking-badge" class="hidden bg-red-50 text-red-700 px-3 py-1.5 rounded-md text-sm font-bold border border-red-200 shadow-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-ranking-star"></i> <span id="detail-ranking"></span>
                    </div>
                </div>
                <p id="detail-subtitle" class="text-xl text-gray-800 font-medium leading-relaxed max-w-4xl opacity-90"></p>

            <div class="grid grid-cols-1 lg:grid-cols-[60%_35%] gap-12 mb-12">
                <div>
                    <h3 id="detail-desc-title" class="text-2xl font-serif font-bold text-charcoal mb-4"></h3>
                    <div id="detail-desc-content" class="space-y-4 text-gray-800 text-lg leading-relaxed"></div>
                </div>

                <div class="bg-cream p-6 border border-customBorder">
                    <h4 class="text-lg font-serif font-bold text-charcoal mb-6 lang-str" data-zh="宏觀經濟與主權數據" data-en="Macroeconomy & Sovereign Data">宏觀經濟與主權數據</h4>
                    <table class="w-full text-sm text-left">
                        <tbody>
                            <tr class="border-b border-customBorder"><td class="py-3 px-2 text-gray-600 w-1/2 lang-str" data-zh="政府體制" data-en="Type of Government">政府體制</td><td id="table-gov" class="py-3 px-2 font-semibold text-charcoal"></td></tr>
                            <tr class="bg-customWhite border-b border-customBorder"><td class="py-3 px-2 text-gray-600 lang-str" data-zh="首都" data-en="Capital">首都</td><td id="table-capital" class="py-3 px-2 font-semibold text-charcoal"></td></tr>
                            <tr class="border-b border-customBorder"><td class="py-3 px-2 text-gray-600 align-top lang-str" data-zh="主權信用評級" data-en="Sovereign Ratings">主權信用評級</td><td id="table-ratings" class="py-3 px-2 font-semibold text-charcoal leading-relaxed"></td></tr>
                            <tr class="bg-customWhite border-b border-customBorder"><td class="py-3 px-2 text-gray-600 lang-str" data-zh="總人口" data-en="Total Population">總人口</td><td id="table-pop" class="py-3 px-2 font-semibold text-charcoal"></td></tr>
                            <tr class="border-b border-customBorder"><td class="py-3 px-2 text-gray-600 lang-str" data-zh="年齡中位數" data-en="Median Age">年齡中位數</td><td id="table-age" class="py-3 px-2 font-semibold text-charcoal"></td></tr>
                            <tr class="bg-customWhite border-b border-customBorder"><td class="py-3 px-2 text-gray-600 lang-str" data-zh="成人平均每人所得(PPP)" data-en="Adult Per Capita Income (PPP)">成人平均每人所得(購買力平價PPP)</td><td id="table-income" class="py-3 px-2 font-semibold text-charcoal"></td></tr>
                            <tr><td class="py-3 px-2 text-gray-600 lang-str" data-zh="國內生產總值(2023)" data-en="Total GDP (2023)">國內生產總值(2023)</td><td id="table-gdp" class="py-3 px-2 font-semibold text-charcoal"></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="section-overview-charts" class="hidden border-t border-customBorder pt-10 mb-12">
                <h3 id="detail-chart-maintitle" class="text-3xl font-serif font-bold text-charcoal mb-8"></h3>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <div id="wrapper-chart-left" class="hidden">
                        <h4 id="chart-left-title" class="text-lg font-bold text-charcoal"></h4>
                        <p id="chart-left-subtitle" class="text-sm text-customGray mb-4"></p>
                        <div id="chart-left-html" class="w-full aspect-[4/3] relative"></div>
                        <p id="chart-left-source" class="text-xs text-customGray opacity-70 mt-2"></p>
                    </div>
                    <div id="wrapper-chart-right" class="hidden">
                        <h4 id="chart-right-title" class="text-lg font-bold text-charcoal"></h4>
                        <p id="chart-right-subtitle" class="text-sm text-customGray mb-4"></p>
                        <div id="chart-right-html" class="w-full aspect-[4/3] relative"></div>
                        <p id="chart-right-source" class="text-xs text-customGray opacity-70 mt-2"></p>
                    </div>
                </div>
            </div>

            <div id="section-banking" class="hidden border-t border-customBorder pt-10 mb-12">
                <h3 class="text-3xl font-serif font-bold text-charcoal mb-8 lang-str" data-zh="銀行與金融" data-en="Banking & Finance">銀行與金融</h3>
                <div class="grid grid-cols-1 lg:grid-cols-[40%_55%] gap-12">
                    <div id="wrapper-trade-invest" class="hidden bg-customWhite p-6 border border-customBorder self-start">
                        <h4 class="text-xl font-serif font-bold text-charcoal mb-6 lang-str" data-zh="貿易與投資" data-en="Trade & Investment">貿易與投資</h4>
                        <table class="w-full text-sm text-left"><tbody id="trade-invest-tbody"></tbody></table>
                        <p id="trade-source" class="text-xs text-customGray opacity-70 mt-4"></p>
                    </div>
                    <div id="wrapper-fdi-chart" class="hidden">
                        <h4 id="fdi-chart-title" class="text-lg font-bold text-charcoal"></h4>
                        <p id="fdi-chart-subtitle" class="text-sm text-customGray mb-4"></p>
                        <div id="fdi-chart-html" class="w-full relative"></div>
                        <p id="fdi-chart-source" class="text-xs text-customGray opacity-70 mt-2"></p>
                    </div>
                </div>
            </div>

            <div id="section-tables" class="hidden pt-2 mb-12">
                <div id="wrapper-leading-companies" class="hidden text-white p-8 mb-8" style="background:var(--charcoal);">
                    <h3 id="leading-companies-title" class="text-2xl font-serif font-bold text-white mb-6"></h3>
                    <table class="w-full text-sm text-left"><tbody id="leading-companies-tbody" class="divide-y divide-gray-600"></tbody></table>
                </div>
                <div id="wrapper-trade-partners" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-customWhite p-8 border border-customBorder">
                        <h4 class="text-xl font-serif font-bold text-charcoal text-center mb-6 lang-str" data-zh="主要貿易夥伴 — 進口" data-en="Major Trade Partners — Import">主要貿易夥伴 — 進口</h4>
                        <table class="w-full text-sm text-left"><tbody id="partners-import-tbody"></tbody></table>
                    </div>
                    <div class="bg-customWhite p-8 border border-customBorder">
                        <h4 class="text-xl font-serif font-bold text-charcoal text-center mb-6 lang-str" data-zh="主要貿易夥伴 — 出口" data-en="Major Trade Partners — Export">主要貿易夥伴 — 出口</h4>
                        <table class="w-full text-sm text-left"><tbody id="partners-export-tbody"></tbody></table>

    <!-- 載入外部國家資料庫 (務必保持這個順序) -->
    <script src="country_data_EN.js"></script>
        
    <!-- 語言切換與視圖互動邏輯 -->
    <script>
        // 💡 1. 語言設定全域變數
        let currentLang = 'zh'; // 預設語言
        let currentCountryKey = null; // 紀錄目前打開的是哪個國家，方便語言切換時重新刷新

        // 💡 2. 語言切換主函數
        function switchLanguage(lang) {
            currentLang = lang;
            // Save to localStorage for cross-page persistence
            localStorage.setItem('siteLang', lang);

            // 更新導覽列的 data-zh/data-en 元素
            document.querySelectorAll('[data-zh][data-en]').forEach(function(e){e.textContent=lang==='zh'?e.dataset.zh:e.dataset.en});
            // 更新導覽列 lang-btn
            document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.textContent.trim()===(lang==='zh'?'中':'EN'))});

            // 更新導覽列 lang-btn 的 active 狀態（已移除頁面內嵌按鈕）

            // 替換 HTML 中所有帶有 .lang-str 標籤的靜態文字
            const elements = document.querySelectorAll('.lang-str');
            elements.forEach(el => {
                if (lang === 'zh') {
                    el.innerText = el.getAttribute('data-zh');
                } else {
                    el.innerText = el.getAttribute('data-en');
                }
            });

            // 如果目前有打開國家詳細資訊，自動刷新該國家的數據
            if (currentCountryKey) {
                showMapDetails(currentCountryKey);
            }
        }

        // ===============================================
        // 地圖互動與工具提示 (Tooltip)
        const tooltip = document.getElementById('map-tooltip');

        function showMapTooltip(event, countryKey) {
            // 💡 這裡直接根據 countryKey 去找資料庫，不再依賴寫死的 HTML 參數
            if (typeof countryDatabase === 'undefined' || !countryDatabase[countryKey]) return;

            const countryObj = countryDatabase[countryKey];
            // 抓取目前語言的資料，如果英文還沒寫，就 fallback 回中文，避免報錯
            const langData = countryObj[currentLang] || countryObj['zh'] || countryObj;

            document.getElementById('tooltip-title').innerText = langData.title || countryKey;
            
            // 設定 tooltip 的雙語描述
            const defaultDesc = currentLang === 'zh' ? '點擊查看詳細資料' : 'Click to view details';
            document.getElementById('tooltip-desc').innerText = defaultDesc;

            const rankingBadge = document.getElementById('tooltip-ranking-badge');
            if (countryObj.ranking) {
                const rankPrefix = currentLang === 'zh' ? '全球最貧窮排名：第' : 'Global Poorest Ranking: #';
                const rankSuffix = currentLang === 'zh' ? '名' : '';
                document.getElementById('tooltip-ranking').innerText = `${rankPrefix} ${countryObj.ranking} ${rankSuffix}`;
                rankingBadge.classList.remove('hidden');
                rankingBadge.classList.add('inline-flex');
            } else {
                rankingBadge.classList.add('hidden');
                rankingBadge.classList.remove('inline-flex');
            }

            tooltip.classList.remove('hidden');
            moveMapTooltip(event);
        }

        function moveMapTooltip(event) {
            tooltip.style.left = event.clientX + 'px';
            tooltip.style.top = (event.clientY - 15) + 'px'; 
        }

        function hideMapTooltip() {
            tooltip.classList.add('hidden');
        }

        // ===============================================
        // 詳細資訊視圖 (Detail View)
        function showMapDetails(countryKey) {
            hideMapTooltip();
            if (typeof countryDatabase === 'undefined') {
                alert(currentLang === 'zh' ? "無法載入國家資料庫！" : "Failed to load country database!");
                return;
            }

            const countryObj = countryDatabase[countryKey];
            if(!countryObj) return;

            // 紀錄目前選擇的國家
            currentCountryKey = countryKey;
            
            // 💡 抓取對應語言的資料
            const data = countryObj[currentLang] || countryObj['zh'] || countryObj;
            
            // 如果只有英文標題 "Taiwan"，那就用 "Taiwan"，如果是中文 "台灣 (Taiwan)"，也可以照舊
            const countryShortName = (data.title || '').split(' ')[0];

            // 1. 填入基礎資料
            document.getElementById('detail-title').innerText = data.title || '';
            document.getElementById('detail-subtitle').innerText = data.subtitle || '';
            document.getElementById('detail-desc-title').innerText = data.descTitle || '';
            
            const flagImg = document.getElementById('detail-flag');
            if (countryObj.flagUrl) {
                flagImg.src = countryObj.flagUrl;
                flagImg.classList.remove('hidden');
            } else {
                flagImg.classList.add('hidden');
            }
            
            const rankingBadgeDetail = document.getElementById('detail-ranking-badge');
            if (countryObj.ranking) {
                const rankPrefix = currentLang === 'zh' ? '全球最貧窮排名(2025)：第' : 'Global Poorest Ranking(2025): #';
                const rankSuffix = currentLang === 'zh' ? '名' : '';
                document.getElementById('detail-ranking').innerText = `${rankPrefix} ${countryObj.ranking} ${rankSuffix}`;
                rankingBadgeDetail.classList.remove('hidden');
            } else {
                rankingBadgeDetail.classList.add('hidden');
            }

            const contentDiv = document.getElementById('detail-desc-content');
            contentDiv.innerHTML = ''; 
            if(data.descParagraphs) {
                data.descParagraphs.forEach(para => {
                    const p = document.createElement('p'); p.innerText = para; contentDiv.appendChild(p);
                });
            }

            if(data.table) {
                document.getElementById('table-gov').innerText = data.table.gov || '';
                document.getElementById('table-capital').innerText = data.table.capital || '';
                document.getElementById('table-ratings').innerHTML = data.table.ratings || '';
                document.getElementById('table-pop').innerText = data.table.pop || '';
                document.getElementById('table-age').innerText = data.table.age || '';
                document.getElementById('table-income').innerText = data.table.income || '';
                document.getElementById('table-gdp').innerText = data.table.gdp || '';
            }

            // A. 雙圖表 (GDP Overview)
            const sectionOverview = document.getElementById('section-overview-charts');
            const wrapLeft = document.getElementById('wrapper-chart-left');
            const wrapRight = document.getElementById('wrapper-chart-right');
            
            if (data.charts) {
                sectionOverview.classList.remove('hidden');
                document.getElementById('detail-chart-maintitle').innerText = currentLang === 'zh' ? `${countryShortName} GDP與經濟概況` : `${countryShortName} GDP & Economic Overview`;
                
                if (data.charts.left) {
                    wrapLeft.classList.remove('hidden');
                    document.getElementById('chart-left-title').innerText = data.charts.left.title || '';
                    document.getElementById('chart-left-subtitle').innerText = data.charts.left.subtitle || '';
                    document.getElementById('chart-left-source').innerText = data.charts.left.source || '';
                    document.getElementById('chart-left-html').innerHTML = data.charts.left.html || '';
                } else { wrapLeft.classList.add('hidden'); }

                if (data.charts.right) {
                    wrapRight.classList.remove('hidden');
                    document.getElementById('chart-right-title').innerText = data.charts.right.title || '';
                    document.getElementById('chart-right-subtitle').innerText = data.charts.right.subtitle || '';
                    document.getElementById('chart-right-source').innerText = data.charts.right.source || '';
                    document.getElementById('chart-right-html').innerHTML = data.charts.right.html || '';
                } else { wrapRight.classList.add('hidden'); }
            } else {
                sectionOverview.classList.add('hidden');
            }

            // B. Banking & Finance
            const sectionBanking = document.getElementById('section-banking');
            const wrapTradeInvest = document.getElementById('wrapper-trade-invest');
            const wrapFdi = document.getElementById('wrapper-fdi-chart');

            if (data.tradeAndInvestment || data.fdiChart) {
                sectionBanking.classList.remove('hidden');
                
                if (data.tradeAndInvestment) {
                    wrapTradeInvest.classList.remove('hidden');
                    document.getElementById('trade-source').innerText = data.tradeAndInvestment.source || '';
                    
                    // 💡 雙語化表格靜態欄位
                    const tExport = currentLang === 'zh' ? '總出口額' : 'Total Exports';
                    const lExport = currentLang === 'zh' ? '主要出口項目' : 'Leading Exports';
                    const tImport = currentLang === 'zh' ? '總進口額' : 'Total Imports';
                    const lImport = currentLang === 'zh' ? '主要進口項目' : 'Leading Imports';

                    const tb = document.getElementById('trade-invest-tbody');
                    tb.innerHTML = `
                        <tr class="border-b border-customBorder"><td class="py-3 px-2 text-customGray w-2/5">${tExport}</td><td class="py-3 px-2 font-semibold text-charcoal">${data.tradeAndInvestment.exports || ''}</td></tr>
                        <tr class="bg-customWhite border-b border-customBorder"><td class="py-3 px-2 text-customGray align-top">${lExport}</td><td class="py-3 px-2 font-semibold text-charcoal leading-relaxed">${data.tradeAndInvestment.leadingExports || ''}</td></tr>
                        <tr class="border-b border-customBorder"><td class="py-3 px-2 text-customGray">${tImport}</td><td class="py-3 px-2 font-semibold text-charcoal">${data.tradeAndInvestment.imports || ''}</td></tr>
                        <tr class="bg-customWhite"><td class="py-3 px-2 text-customGray align-top">${lImport}</td><td class="py-3 px-2 font-semibold text-charcoal leading-relaxed">${data.tradeAndInvestment.leadingImports || ''}</td></tr>
                    `;
                } else { wrapTradeInvest.classList.add('hidden'); }

                if (data.fdiChart) {
                    wrapFdi.classList.remove('hidden');
                    document.getElementById('fdi-chart-title').innerText = data.fdiChart.title || '';
                    document.getElementById('fdi-chart-subtitle').innerText = data.fdiChart.subtitle || '';
                    document.getElementById('fdi-chart-source').innerText = data.fdiChart.source || '';
                    document.getElementById('fdi-chart-html').innerHTML = data.fdiChart.html || '';
                } else { wrapFdi.classList.add('hidden'); }
            } else {
                sectionBanking.classList.add('hidden');
            }

            // C. 底部三大表格
            const sectionTables = document.getElementById('section-tables');
            const wrapLeading = document.getElementById('wrapper-leading-companies');
            const wrapPartners = document.getElementById('wrapper-trade-partners');

            if (data.leadingCompanies || data.tradePartners) {
                sectionTables.classList.remove('hidden');
                
                if (data.leadingCompanies && data.leadingCompanies.length > 0) {
                    wrapLeading.classList.remove('hidden');
                    document.getElementById('leading-companies-title').innerText = currentLang === 'zh' ? `${countryShortName} 主要企業` : `${countryShortName} Leading Companies`;
                    const tbLeading = document.getElementById('leading-companies-tbody');
                    tbLeading.innerHTML = '';
                    data.leadingCompanies.forEach(comp => {
                        tbLeading.innerHTML += `<tr><td class="py-4 font-semibold text-white">${comp.name}</td><td class="py-4 text-right font-bold text-gray-300">${comp.sector}</td></tr>`;
                    });
                } else { wrapLeading.classList.add('hidden'); }

                if (data.tradePartners) {
                    wrapPartners.classList.remove('hidden');
                    document.getElementById('partners-source').innerText = data.tradePartners.source || '';
                    
                    const tbImp = document.getElementById('partners-import-tbody');
                    tbImp.innerHTML = '';
                    data.tradePartners.import.forEach((p, index) => {
                        const bg = index % 2 !== 0 ? 'bg-gray-50' : '';
                        tbImp.innerHTML += `<tr class="border-b border-gray-100 ${bg}"><td class="py-3 px-2 text-customGray">${p.country}</td><td class="py-3 px-2 text-right font-bold text-charcoal">${p.percent}</td></tr>`;
                    });

                    const tbExp = document.getElementById('partners-export-tbody');
                    tbExp.innerHTML = '';
                    data.tradePartners.export.forEach((p, index) => {
                        const bg = index % 2 !== 0 ? 'bg-gray-50' : '';
                        tbExp.innerHTML += `<tr class="border-b border-gray-100 ${bg}"><td class="py-3 px-2 text-customGray">${p.country}</td><td class="py-3 px-2 text-right font-bold text-charcoal">${p.percent}</td></tr>`;
                    });
                } else {
                    wrapPartners.classList.add('hidden');
                    document.getElementById('partners-source').innerText = '';
                }
            } else {
                sectionTables.classList.add('hidden');
            }

            document.getElementById('map-main-view').classList.add('hidden');
            document.getElementById('map-main-view').classList.remove('block');
            document.getElementById('map-detail-view').classList.remove('hidden');
            document.getElementById('map-detail-view').classList.add('block');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideMapDetails() {
            currentCountryKey = null; // 清除目前選擇的國家
            document.getElementById('map-detail-view').classList.add('hidden');
            document.getElementById('map-detail-view').classList.remove('block');
            document.getElementById('map-main-view').classList.remove('hidden');
            document.getElementById('map-main-view').classList.add('block');
        }

        // Apply saved language on page load
        (function(){
            var saved = localStorage.getItem('siteLang') || 'zh';
            if(saved !== 'zh') switchLanguage(saved);
        })();
    </script>
